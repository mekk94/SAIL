<section id="customs" class="customs section">
      <div class="customs__container">
        <div class="customs__content" appSectionReveal>
          <div class="customs__panel">
            <app-section-label
              [label]="i18n.t('customs.label')"
              [number]="i18n.t('customs.number')"
            />

            <h2 class="customs__title">{{ i18n.t('customs.title') }}</h2>
            <p class="customs__subtitle">{{ i18n.t('customs.subtitle') }}</p>

            <div class="customs__services">
              @for (service of services(); track service.title; let i = $index) {
                <div class="customs__service">
                  <div class="customs__service-step" aria-hidden="true">
                    <span class="customs__step-icon">
                      @switch (i) {
                        @case (0) { <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> }
                        @case (1) { <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> }
                        @case (2) { <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> }
                      }
                    </span>
                    @if (i < services().length - 1) {
                      <span class="customs__step-line"></span>
                    }
                  </div>
                  <div class="customs__service-body">
                    <h3 class="customs__service-title">{{ service.title }}</h3>
                    <p class="customs__service-desc">{{ service.description }}</p>
                  </div>
                </div>
              }
            </div>
          </div>
        </div>

        <div class="customs__image image-modern-wrapper" appSectionReveal [revealDelay]="200" revealClass="sail-reveal-end">
          <img src="assets/images/Customs%20Clearance%20Services.webp" alt="Customs Clearance Services" class="image-modern">
        </div>
      </div>
    </section>
