<section id="freight-forwarding" class="ff section">
      <div class="ff__container">
        <div class="ff__header" appSectionReveal>
          <app-section-label
            [label]="i18n.t('freightForwarding.label')"
            [number]="i18n.t('freightForwarding.number')"
          />
          <h2 class="ff__title">{{ i18n.t('freightForwarding.title') }}</h2>
          <p class="ff__subtitle">{{ i18n.t('freightForwarding.subtitle') }}</p>
        </div>

        <div class="ff__grid" appSectionReveal [revealDelay]="200" revealClass="sail-stagger">
          @for (service of services(); track service.title; let i = $index) {
            <div
              class="ff__item"
              [class.ff__item--active]="activeIndex() === i"
              (mouseenter)="activeIndex.set(i)"
              (focus)="activeIndex.set(i)"
              tabindex="0"
              [attr.aria-label]="service.title"
            >
              <div class="ff__item-icon" aria-hidden="true">
                @switch (i) {
                  @case (0) { <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 12h20"/><path d="M20 12v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/><path d="M4 12l2-7a2 2 0 0 1 2-1h8a2 2 0 0 1 2 1l2 7"/></svg> }
                  @case (1) { <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.6L3 8l6.5 4-2.5 2.5-3-1L3 14l2.5 2.5L3 19l2.5 2.5L8 19l2.5 2.5 2-1-1-3 2.5-2.5 4 6.5c.4.2.7.2 1.1-.3l1.2-1.7c.4-.2.1-.6-.5-1.1z"/></svg> }
                  @case (2) { <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> }
                  @case (3) { <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h2"/><path d="M14 9h4.24a2 2 0 0 1 1.42.59l1.75 1.75a2 2 0 0 1 .59 1.42V17"/><circle cx="8" cy="17" r="2"/><circle cx="18" cy="17" r="2"/></svg> }
                }
              </div>
              <div class="ff__item-content">
                <div class="ff__item-tag">{{ service.tag }}</div>
                <h3 class="ff__item-title">{{ service.title }}</h3>
                <p class="ff__item-desc">{{ service.description }}</p>
              </div>
              <div class="ff__item-accent" aria-hidden="true"></div>
            </div>
          }
        </div>

        <!-- Connecting route line -->
        <div class="ff__route" aria-hidden="true">
          <svg viewBox="0 0 4 400" class="ff__route-svg" preserveAspectRatio="none">
            <line x1="2" y1="0" x2="2" y2="400" stroke="#C4892F" stroke-width="1" opacity="0.12" stroke-dasharray="4 6"/>
          </svg>
        </div>
      </div>
    </section>
