<section id="transportation" class="transport section">
      <div class="transport__container">
        <div class="image-modern-wrapper" appSectionReveal revealClass="sail-reveal-start">
          <img src="assets/images/transportation.webp" alt="Transportation Services" class="image-modern">
        </div>

        <div class="transport__content" appSectionReveal [revealDelay]="200">
          <div class="transport__panel">
            <app-section-label
              [label]="i18n.t('transportation.label')"
              [number]="i18n.t('transportation.number')"
            />

            <h2 class="transport__title">{{ i18n.t('transportation.title') }}</h2>

            <p class="transport__subtitle">{{ i18n.t('transportation.subtitle') }}</p>

            <ul class="transport__list">
              @for (service of services(); track service; let i = $index) {
                <li class="transport__list-item">
                  <span class="transport__list-icon" aria-hidden="true">
                    @switch (i) {
                      @case (0) { <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h12"/><path d="M12 6v12"/></svg> }
                      @case (1) { <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg> }
                      @case (2) { <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h2"/><path d="M14 9h4.24a2 2 0 0 1 1.42.59l1.75 1.75a2 2 0 0 1 .59 1.42V17"/><circle cx="8" cy="17" r="2"/><circle cx="18" cy="17" r="2"/></svg> }
                      @case (3) { <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> }
                    }
                  </span>
                  <span>{{ service }}</span>
                </li>
              }
            </ul>
          </div>
        </div>
      </div>
    </section>
